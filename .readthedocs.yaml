version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "miniforge3-latest"
  jobs:
    install:
      - pip list
      - pip install -r devtools/conda-envs/requirements.txt
      - pip list
      - pip install --index-url https://pypi.org/simple/ --extra-index-url https://test.pypi.org/simple/ --no-build-isolation .
      - pip list

sphinx:
  configuration: docs/conf.py

