[workspace]
authors = ["Matthew W. Thompson <mattwthompson@protonmail.com>"]
channels = ["conda-forge"]
name = "openff-units"
platforms = ["osx-arm64", "linux-64"]

[tasks]
run_dummy_tests = "python -m pytest -v -n auto downstream_dummy/tests/"
run_tests = "python -m pytest -v -n auto openff/units/"
run_mypy = "python -m mypy -p 'openff.units' && python -m mypy downstream_dummy/ --exclude=downstream_dummy/build/"
run_docexamples = "pytest --doctest-modules openff --ignore=openff/units/_tests"

[dependencies]
python = "*"
pip = "*"
numpy = "*"
pint = ">=0.25,<0.27"
openff-utilities = ">=0.1.3"
uncertainties = "*"

[pypi-options.dependency-overrides]
pint = ">=0.25,<0.27"

[pypi-dependencies]
openff-units = { path = ".", editable = true}
openff-units-downstream-dummy = { path = "downstream_dummy/" }

[feature.pydantic.pypi-dependencies]
pydantic = "==2.13.*"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
pytest-xdist = "*"
pytest-randomly = "*"

[feature.typing.pypi-dependencies]
mypy = "*"
types-setuptools = "*"

[feature.dev.dependencies]
pre-commit = "*"
ipython = "*"

[feature.docs.dependencies]
sphinx = ">=4.5,<5"
myst-parser = ">=0.13.6"
sphinx-notfound-page = "*"
typing-extensions = "*"
beautifulsoup4 = "*"

[feature.docs.pypi-dependencies]
openff-sphinx-theme = {
  git = "https://github.com/openforcefield/openff-sphinx-theme",
  rev = "main",
}
openff-units = { path = ".", editable = true }

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.openmm.dependencies]
openmm = ">=8.3"

[feature.pint25.dependencies]
pint = "0.25.*"

[feature.pint26.dependencies]
pint = "0.26.*"

[environments]
dev = [ "py312", "test", "typing", "dev"]
py312pint25 = [ "py312", "test", "typing", "pint25" ]
py313pint25 = [ "py313", "test", "typing", "pint25" ]
py314pint25 = [ "py314", "test", "typing", "pint25" ]
py312pint25openmm = [ "py312", "test", "typing", "pint25", "openmm" ]
py313pint25openmm = [ "py313", "test", "typing", "pint25", "openmm" ]
py314pint25openmm = [ "py314", "test", "typing", "pint25", "openmm" ]
py312pint26 = [ "py312", "test", "typing", "pint26" ]
py313pint26 = [ "py313", "test", "typing", "pint26" ]
py314pint26 = [ "py314", "test", "typing", "pint26" ]
py312pint26openmm = [ "py312", "test", "typing", "pint26", "openmm" ]
py313pint26openmm = [ "py313", "test", "typing", "pint26", "openmm" ]
py314pint26openmm = [ "py314", "test", "typing", "pint26", "openmm" ]
py312pydantic = [ "py312", "test", "typing", "pydantic", "pint26" ]
py313pydantic = [ "py313", "test", "typing", "pydantic", "pint26" ]
py314pydantic = [ "py314", "test", "typing", "pydantic", "pint26" ]
docs = ["py312", "pint26", "docs"]
